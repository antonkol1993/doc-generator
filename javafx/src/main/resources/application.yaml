spring:
  datasource:
    url: jdbc:sqlite:${app.database.path}/${app.database.name}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  liquibase:
    change-log: classpath:db/changelog/liquibase-changeLog.yaml
    enabled: true
    contexts: dev

app:
  database:
    path: ${user.dir}/data
    name: m-group-trade.db
  storage:
    path: storage/images/metalware

